name: Validate IaC (no cloud deployment)
on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-contracts.txt -r requirements-onprem.txt -r requirements-observability.txt
      - run: python tools/build_contract.py --check
      - run: |
          for stage in preflight prepare inspect cleanup; do
            ansible-playbook --syntax-check -i localhost, "ansible/playbooks/$stage.yml"
          done
      - run: python -m unittest discover -s tests -v
      - run: python tools/render_inputs.py validate --cloud aws --base environments/aws/deployment.example.tfvars.json
      - run: python tools/render_inputs.py validate --cloud gcp --base environments/gcp/deployment.example.tfvars.json

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [environments/aws, environments/gcp, environments/tailscale/aws, environments/tailscale/gcp, modules/tailscale_bootstrap, modules/app_migration_worker, environments/foundation/aws, environments/foundation/gcp, environments/platform/aws]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive "$GITHUB_WORKSPACE"
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate -no-color
      - run: terraform test -no-color
