components:
  securitySchemes:
    platformBearer:
      type: http
      scheme: bearer
      description: Platform identity. Claims and every resource reference must be authorization-checked by the server.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Same principal+method+path+key and same body returns original result. Different body -> 409.
    DeploymentId:
      name: deployment_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{3,100}$
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{3,100}$
    PlanId:
      name: plan_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9_-]{3,100}$
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        enum:
        - aws-web
        - gcp-web
    TemplateVersion:
      name: version
      in: path
      required: true
      schema:
        type: string
  schemas:
    AwsSizing:
      type: object
      additionalProperties: false
      properties:
        compute_instance_type:
          type: string
          enum:
          - t3.small
          - t3.medium
          - m6i.large
          title: 앱 서버 사양
          default: t3.small
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        compute_disk_gib:
          type: integer
          minimum: 20
          maximum: 200
          title: 앱 디스크 용량 (GiB)
          default: 30
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        db_instance_class:
          type: string
          enum:
          - db.t3.micro
          - db.t3.small
          - db.m6g.large
          title: DB 사양
          default: db.t3.micro
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        db_storage_gib:
          type: integer
          minimum: 20
          maximum: 200
          title: DB 초기 용량 (GiB)
          default: 20
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        db_max_storage_gib:
          type: integer
          minimum: 22
          maximum: 500
          title: DB 자동 확장 상한 (GiB)
          default: 100
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        db_multi_az:
          type: boolean
          title: DB Multi-AZ
          default: false
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        cache_node_type:
          type: string
          enum:
          - cache.t3.micro
          - cache.t3.small
          - cache.m6g.large
          title: 캐시 노드 사양
          default: cache.t3.micro
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
        cache_node_count:
          type: integer
          minimum: 1
          maximum: 3
          title: 캐시 노드 수
          default: 1
          x-ui:
            group: sizing
            editable_by:
            - editor
            ai_recommendable: true
      required:
      - compute_instance_type
      - compute_disk_gib
      - db_instance_class
      - db_storage_gib
      - db_max_storage_gib
      - db_multi_az
      - cache_node_type
      - cache_node_count
    AwsInputs:
      type: object
      additionalProperties: false
      properties:
        deployment_id:
          type: string
          x-ui:
            group: platform
            editable_by:
            - editor
