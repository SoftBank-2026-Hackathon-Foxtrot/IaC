# Control-plane seed for the chiikawa group-buy app: either direction (aws → gcp or gcp → aws). Resources left out are skipped:
# their cutover stage is SKIPPED and their adapter never called (control-plane README).
#
# Keep in step with the deployment:
#   environments.*.appUrl   app VM private IP and port, reached over the tailnet. A VM replaced by
#                           the provisioner gets a new private IP: update it here.
#   environments.*.actors   the apps' WORKLOAD_ACTOR names and process counts (uvicorn --workers 4,
#                           two worker containers). Also the DB adapter's published workload scope.
#   resources.redis refs    keys of STATEMIG_ENDPOINTS (redis-endpoints-admin secret)
#   resources.object refs   keys of OBJECT_RESOURCES (variables.tf object_resources)
application: chiikawa
scope: scope:chiikawa

# Explicit shared system-metric readers; IDs match the provisioner records.
# Removing an entry revokes shared metric access. It does not delete the app.
systemDeployments:
  - environmentId: env-784e02b9c9d5
    deploymentId: chiikawa-aws-3e3d
    ownerId: chiikawa
    environment: aws
  - environmentId: env-4f5690bb766b
    deploymentId: chiikawa-gcp-1975
    ownerId: chiikawa
    environment: gcp

environments:
  aws:
    appUrl: http://10.10.0.79:8000
    trafficPool: aws  # an environment name in the traffic service's CF_POOL_IDS
    actors: {chiikawa-aws-api: 4, chiikawa-aws-worker: 2}
    # This environment's resources. A workflow takes its source refs from its source environment
    # and its target refs from its target environment (control-plane#13): no edit per direction.
    resources: {database: "db:chiikawa-aws-3e3d", redis: "resource:aws", object: "resource:aws-receipts"}
  gcp:
    appUrl: http://10.20.0.2:8000
    trafficPool: gcp  # its origin points at tunnel foxtrot-chiikawa-gcp during our tests (tools/gcp_pool_origin.sh)
    actors: {chiikawa-gcp-api: 4, chiikawa-gcp-worker: 2}
    resources: {database: "db:chiikawa-gcp-1975", redis: "resource:gcp", object: "resource:gcp-receipts"}

resources:
  # Refs come from environments.*.resources; the console's direction picks source and target.
  # The DB adapter refuses a source that is not the binding's current database
  # (BINDING_ROUTE_MISMATCH), so the right direction is the one everything currently lives on.
  database:
    policy: {rollbackMode: BEFORE_TARGET_WRITE, maxQuiesceSeconds: 60}
    catalog:
      alias: chiikawa
      appRef: app:chiikawa
      tables: [public.chat_messages, public.groupbuys, public.join_requests, public.notifications, public.orders, public.stats]
      sequences: []
      databases:
        db:chiikawa-aws-3e3d:
          identity: AWS_RDS:arn:aws:rds:ap-northeast-2:952561150367:db:chiikawa-aws-3e3d-db/app
          provider: AWS_RDS
          provider_instance: arn:aws:rds:ap-northeast-2:952561150367:db:chiikawa-aws-3e3d-db
          secret_ref: arn:aws:secretsmanager:ap-northeast-2:952561150367:secret:foxtrot/app/chiikawa-aws-3e3d/db-operator-iE9FAT
          writer_role: app
          route_host: chiikawa-aws-3e3d-db.cxg4inxrw1qh.ap-northeast-2.rds.amazonaws.com
          database: app
        db:chiikawa-gcp-1975:
          identity: GCP_CLOUDSQL:projects/foxtrot-513413/instances/chiikawa-gcp-1975-db/app
          provider: GCP_CLOUDSQL
          provider_instance: projects/foxtrot-513413/instances/chiikawa-gcp-1975-db
          secret_ref: __CHIIKAWA_CLOUDSQL_SECRET_REF__  # filled by Terraform (cloudsql_target.tf)
          writer_role: app
          route_host: 27-d9eb3522-319b-442c-97dc-48420699f4f7.asia-northeast3.sql.goog
          database: app
  redis:
    bindingRef: binding:redis-proxy
    policy: {rollbackMode: REVERSE_REQUIRED, maxQuiesceSeconds: 1.8}
  object:
    bindingRef: binding:receipts
    # Every API and worker process of both environments follows the route on its own.
    expectedApps: 12
    policy: {rollbackMode: REVERSE_REQUIRED, maxQuiesceSeconds: 30}

adapters:
  database: {url: "https://db-proxy.internal:8080", tokenSecret: "env:DB_ADAPTER_TOKEN", verify: "/tmp/foxtrot-ca.pem"}
  redis: {url: "http://redis-migrator.internal:8090", tokenSecret: "env:REDIS_ADAPTER_TOKEN"}
  object: {url: "http://object-migration.internal:8080", tokenSecret: "env:OBJECT_ADAPTER_TOKEN"}

probe:
  user: probe-platform
  groupbuyId: 9  # 라코 티셔츠: stock 1,000,000, so probe orders never sell it out
  cleanupPath: null

canaryWeights: [5]
trafficWeights: [25, 50, 100]
